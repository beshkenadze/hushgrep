[package]
name = "hushgrep"
version = "0.1.0-alpha.3"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-27"] }
percent-encoding = "2"
regex = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
url = "2"

[profile.release]
strip = "symbols"
